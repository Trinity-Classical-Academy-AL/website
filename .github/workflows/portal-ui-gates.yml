name: portal-ui-gates

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'packages/school/**'
      - 'tests/portal-*.mjs'
      - '.github/workflows/portal-ui-gates.yml'

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Programmatic UI gates
        run: node portal/ui-eval/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-ui-gates
          path: portal/ui-eval/reports/
