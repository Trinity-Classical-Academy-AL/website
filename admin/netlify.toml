# Staff admin for admin.trinityclassical.academy.
# In Netlify, set this site's base directory to `admin`.
# The build command runs from the repo root so the shared package installs.

[build]
  command = "cd .. && npm install && npm run build --workspace=admin"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
