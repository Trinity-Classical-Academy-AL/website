# Netlify deployment config for Trinity Classical Academy
#
# What this does:
# - Locks in the build command and publish directory so Netlify doesn't
#   have to guess. Astro's default output is `dist/`.
# - Sets the Node version explicitly so fontsource + @astrojs/sitemap
#   resolve correctly (Astro 6 + Node 22).
# - Declares the `contact` form so Netlify's build-time form detection
#   picks it up even if Astro's HTML transformation changes attributes.
# - Sets long-lived caching headers for bundled assets (immutable hash
#   filenames emitted by Astro into `/_astro/`) and conservative caching
#   for HTML.
# - Adds security headers by default.

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions-dist"

[functions]
  # The functions are already bundled, including @tca/school. Netlify's
  # default bundler leaves that package's TypeScript entry for Node to load.
  node_bundler = "none"

[build.environment]
  NODE_VERSION = "22.23.4"
  # Public PostHog client key (phc_…). Safe to commit; Astro inlines PUBLIC_* at build time.
  PUBLIC_POSTHOG_PROJECT_TOKEN = "phc_rjCMY9uEWr295ZMPSj5YXYDxdCGdQwNSBqqMJhyb4RiU"
  PUBLIC_POSTHOG_HOST = "https://us.i.posthog.com"

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------

# Bundled assets (JS, CSS, fonts, images) have content-hashed filenames, so
# they can be cached forever. Cache-busting is handled by the filename hash.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files and the sitemap should revalidate on every request so content
# updates propagate quickly.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# DATABASE_URL (Neon) is required for the banner, tour dates, tour requests, and interest notes.
# Set the same database on the website, the admin site, and the family portal.
# Use a separate Neon branch for deploy previews so a preview cannot edit live rows.
# Flyers stay in this site's Netlify Blobs. See docs/architecture.md.
# Optional mail: RESEND_API_KEY, EMAIL_FROM, STAFF_NOTIFY_EMAIL.
# Optional extra hook: SCHOOL_NOTIFY_WEBHOOK_URL, SCHOOL_NOTIFY_WEBHOOK_TOKEN.

# Deploy previews can open every tour, interest, and banner state with a
# query string (?state=, ?interest-state=, ?banner=). Production builds omit this.
[context.deploy-preview.environment]
  PUBLIC_PREVIEW_STATES = "true"

[context.branch-deploy.environment]
  PUBLIC_PREVIEW_STATES = "true"

