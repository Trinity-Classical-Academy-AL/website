# TCA Portal. Live at portal.trinityclassical.academy.
# In Netlify, set this site's base directory to `portal`.

[build]
  command = "cd .. && npm install && npm run build --workspace=portal"
  publish = "dist"
  # The portal also bundles ../packages (shared @tca/school code), ../src/lib and the root lockfile.
  # Netlify's default skips builds when nothing under the base directory changed, which silently
  # left server fixes in packages/ undeployed. Build when any of these change (exit 0 = skip).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../packages ../src/lib ../package.json ../package-lock.json"

[build.environment]
  NODE_VERSION = "22.23.4"

# The hourly function only queues work. The background function has 15 minutes for the paced pull.
# Set CLASSREACH_USERNAME and CLASSREACH_PASSWORD on this site (tca-portal-al). Until both are set, the function returns without calling ClassReach.
[functions."classreach-sync-background"]
  timeout = 900

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
