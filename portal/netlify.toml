# TCA Portal. Live at portal.trinityclassical.academy.
# In Netlify, set this site's base directory to `portal`.

[build]
  command = "cd .. && npm install && npm run build --workspace=portal"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# ClassReach sync. Runs hourly; the function adds a short random delay and refuses a second run inside 60 minutes.
# Set CLASSREACH_USERNAME and CLASSREACH_PASSWORD on this site (tca-portal-al). Until both are set, the function returns without calling ClassReach.
[functions."classreach-sync"]
  timeout = 900

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/fonts.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
